summary: >-
  The Bank of London ships NO Model Context Protocol server. Its published AI work is TBOL(R) AI, a
  generative code assistant embedded in the Developer Studio that answers developer questions in
  natural language across several programming languages — a human-facing chat surface, not an agent
  endpoint. No MCP endpoint, no stdio package and no tools/list manifest exists on any host, and no
  MCP mention appears anywhere in the docs, the route manifest or the press releases. The tools below
  are a CANDIDATE surface derived one-to-one from the published OpenAPI operations so the shape of a
  future server is on record. Nothing here is served by the provider.
