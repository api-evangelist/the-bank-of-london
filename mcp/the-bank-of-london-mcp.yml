agent_readiness_note: >-
  Any real server here would have to solve request signing on the agent's behalf: every call needs a
  freshly minted PS256 detached JWS with a unique nonce and a 5-minute freshness window, which is not
  something an agent can be handed as a static bearer token. That is the single largest engineering
  reason this bank has no MCP surface today, and the most useful thing a server would actually do.
