summary: >-
  Eleven first-class entities hanging off two roots: an Organisation (the customer of the bank, v3)
  and a physical Account. Everything that moves money or reports on it belongs to an Account.
  The distinctive shape is Virtual Account Management — a hierarchy of aggregator nodes above
  virtual accounts, each virtual account pinned to a real "header" account, which is how the bank
  supports safeguarding and client-money segregation without opening a real account per end client.
  Ids are typed at the schema level rather than being bare strings, which is unusually disciplined
  and makes the reference graph readable straight from the contract.
id_conventions:
  typed_ids: true
  note: >-
    Each entity's identifier has its own named schema, and a foreign-key field $refs the OWNER's id
    schema, so the direction of every reference is explicit in the contract.
  account_id_format: >-
    Account identifiers appear in the documented form GB-040075-12345678 (country, sort code, account
    number), e.g. in the webhook PAYMENT_FAILED sample payload.
