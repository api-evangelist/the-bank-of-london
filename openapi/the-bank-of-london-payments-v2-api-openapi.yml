          status:
            enum:
            - 504
          name:
            enum:
            - GatewayTimeout
          message:
            example: Gateway timeout
    PaymentCreatorSystemType:
      type: string
      description: The type of the payment creator. Created by the system, usually standing order payments.
      enum:
      - SYSTEM
    CrossBorderFxDetails:
      type: object
      title: Cross-border FX Details
      description: 'Foreign exchange details used to create the cross-border payment. This object will only be present if the currency of the debitor account is different to the currency of the payment.

        '
      properties:
        exchangeRate:
          $ref: '#/components/schemas/ExchangeRate'
        sell:
          type: object
          description: Sell currency details
          properties:
            currency:
              $ref: '#/components/schemas/QuoteSellCurrency'
            amount:
              $ref: '#/components/schemas/SellAmount'
          required:
          - currency
          - amount
        buy:
          type: object
          description: Buy currency details
          properties:
            currency:
              $ref: '#/components/schemas/QuoteBuyCurrency'
            amount:
              $ref: '#/components/schemas/BuyAmount'
          required:
          - currency
          - amount
      required:
      - exchangeRate
      - sell
      - buy
    CrossBorderAmount:
