              `CH11`: Currency not supported by receiving agent. \

              `CH16`: Creditor Agent is not reachable. \

              `CH17`: Invalid or missing identification required within a particular country or payment type. \

              `DT01`: Invalid date. \

              `FF01`: Operation/transaction code incorrect or invalid file format. \

              `FF05`: Invalid Local Instrument. \

              `FOCR`: Return following investigation. \

              `FRAD`: Fraudulent originated payment. \

              `MD01`: No mandate. \

              `MD02`: Missing mandatory information in mandate. \

              `MD06`: Return of payment for technical reasons. \

              `MD07`: End customer is deceased. \

              `MS02`: Reason has not been specified by end customer. \

              `MS03`: Reason has not been specified by agent. \

              `NARR`: Reason is provided in additional information. \

              `RC01`: Bank identifier incorrect. \

              `RC04`: Invalid creditor account number. \

              `RF01`: Operation/transaction code incorrect or invalid file format. \

              `RR01`: Regulatory reason. \

              `RR02`: Invalid bank operation code. \

              `RR03`: Invalid transaction/operation code. \

              `RR04`: Regulatory reason. \

              `SL01`: Specific service offered by the debtor agent. \

              `TM01`: Cut-off time. \

              `UPAY`: Payment is not justified.

              '
