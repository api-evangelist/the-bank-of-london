          $ref: '#/components/schemas/AccountId'
        sortCode:
          $ref: '#/components/schemas/UkSortCode'
        accountNumber:
          $ref: '#/components/schemas/UkAccountNumber'
        accountHolderName:
          $ref: '#/components/schemas/AccountHolderName'
      required:
      - type
      - accountId
      - sortCode
      - accountNumber
      - accountHolderName
    PlannedPaymentExecutionDate:
      type: string
      description: The date when the payment should be executed by Bank of London. Any future date can be provided to schedule a future payment. Payments are processed in the Europe/London timezone so this must be a UK date in the format `YYYY-MM-DD`. `2022-10-05` is a valid example.
      format: date
      example: '2022-10-05'
    QuoteBuyCurrency:
      type: string
      description: 'The ISO 4217 currency code representing the currency being bought. This value must correspond to the currency of the destination account to which funds are credited.

        '
      enum:
      - GBP
      - EUR
      - USD
      example: USD
    CrossBorderAccountIBAN:
      type: string
      description: IBAN details for the account
      pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
      example: GB33XXXX1234567890123456
    CrossBorderDebtor:
