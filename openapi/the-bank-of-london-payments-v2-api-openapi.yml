    CreditorAgentBankIdentifier:
      type: string
      description: 'Bank identifier for the payment based on the region where the payment is identified.

        Examples include:

        - U.S. ABA routing number (e.g., 021000021)

        - Australia BSB (Bank State Branch) code

        - India IFSC (Indian Financial System Code)

        - Brazil COMPE code

        - UK Sort Code for UK destined payments

        '
      minLength: 1
      maxLength: 28
      pattern: ^[0-9a-zA-Z/\-?:().,'+ ]+$
      example: '021000021'
    ValidationError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseJSON'
      - properties:
          status:
            enum:
            - 422
          name:
            enum:
            - ValidationFailure
            - UnprocessableEntity
          message:
            example: Validation Failed
    PaymentStandingOrderId:
