          detailedStatusIdentifier:
            description: '<span style="color:#f46d2a">**Attention**</span> \

              Please note that the allowed values for the **detailedStatusIdentifier** are

              extensible and new values can be added in the future without a

              major version change. Please ensure this is factored into your

              application code.

              '
            enum:
            - ACCEPTED_CUSTOMER_PROFILE
            - ACCEPTED_SETTLEMENT_IN_PROCESS
            - ACCEPTED_TECHNICAL_VALIDATION
            - INFORMATORY
            - RECEIVED
            - PENDING
            - WAITING
          history:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatusHistory'
        required:
        - identifier
        - detailedStatusIdentifier
        - history
      - type: object
        title: APPROVED
        properties:
          identifier:
            type: string
            enum:
            - APPROVED
            description: The payment has been approved by an authorised payment approver.
          detailedStatusIdentifier:
            description: '<span style="color:#f46d2a">**Attention**</span> \

              Please note that the allowed values for the **detailedStatusIdentifier** are

              extensible and new values can be added in the future without a

              major version change. Please ensure this is factored into your

              application code.

              '
            type: string
            enum:
            - APPROVED
          history:
            type: array
            items:
