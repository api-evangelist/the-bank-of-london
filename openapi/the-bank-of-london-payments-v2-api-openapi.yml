    CrossBorderPaymentStatus:
      description: "<span style=\"color:#f46d2a\">**Attention**</span> \\\nPlease note that the status is a oneOf object linked to the **identifier** in the object. \nThe **status** oneOf, based on the **identifier** is extensible and new status identifiers can be added in the future without a\nmajor version change. Please ensure this is factored into your application code.\n\nThe current status of the cross-border payment.\n"
      oneOf:
      - type: object
        title: PENDING_APPROVAL
        properties:
          identifier:
            type: string
            enum:
            - PENDING_APPROVAL
            description: Initial status of a cross-border payment that requires approval before processing.
        required:
        - identifier
      - type: object
        title: PENDING
        properties:
          identifier:
            type: string
            enum:
            - PENDING
            description: Cross-border payment is currently being processed within Bank of London system.
        required:
        - identifier
      - type: object
        title: APPROVED
        properties:
          identifier:
            type: string
            enum:
            - APPROVED
            description: The cross-border payment has been approved by an authorised payment approver.
        required:
        - identifier
      - type: object
        title: REJECTED
        properties:
          identifier:
            type: string
            enum:
            - REJECTED
            description: The cross-border payment has been rejected by an authorised payment approver.
        required:
        - identifier
      - type: object
        title: SUCCESSFUL
        properties:
          identifier:
            type: string
            enum:
            - SUCCESSFUL
            description: Cross-border payment has been processed and passed all checks.
        required:
        - identifier
      - type: object
        title: FAILED
        properties:
          identifier:
            type: string
            enum:
            - FAILED
            description: One or more checks failed whilst processing the cross-border payment.
          reasonCode:
            type: string
            description: 'Cross-border payment rejection reason code. \

              `AB01`: Clearing process aborted due to timeout. \

              `AB02`: Clearing process aborted due to a fatal error. \

              `AB03`: Settlement aborted due to timeout. \

              `AB05`: Transaction stopped due to timeout at the Creditor Agent. \

              `AB08`: Creditor Agent is not online. \

              `AC03`: Creditor account number invalid or missing. \

              `AC05`: Debtor account number closed. \

              `AC06`: Specified account is blocked, prohibiting posting of transactions against it. \

              `AC07`: Creditor account number closed. \

              `AC08`: Branch code is invalid or missing. \

              `AC10`: Debtor account currency is invalid or missing. \

              `AC11`: Creditor account currency is invalid or missing. \

              `AC13`: Debtor account type missing or invalid. \

              `AC14`: Creditor account type missing or invalid. \

              `AC15`: The account details for the counterparty have changed. \

              `AG01`: Transaction forbidden on this type of account. \

              `AG10`: Agent of message is suspended from the Real Time Payment system. \

              `AG11`: Creditor Agent of message is suspended from the Real Time Payment system. \

              `AM04`: Amount of funds available to cover specified message amount is insufficient. \

              `AM14`: Transaction amount exceeds limits agreed between bank and client. \

              `AM23`: Transaction amount exceeds settlement limit. \

              `BE01`: Identification of end customer is not consistent with associated account number. \

              `BE04`: Specification of creditor''s address, which is required for payment, is missing/not correct. \

              `BE05`: Party who initiated the message is not recognised by the end customer. \

              `BE06`: End customer specified is not known at associated Sort/National Bank Identifier or does no longer exist in the books. \

              `BE15`: Identification code missing or invalid. \

              `BE17`: Creditor or Ultimate Creditor identification code missing or invalid. \

              `BE20`: Name length exceeds local rules for payment type. \

              `BE21`: Name missing or invalid. \

              `BE22`: Creditor name is missing. \

              `DU01`: Message identification is not unique, \

              `DU03`: Transaction is not unique. \

              `FF02`: Syntax error. \

              `MD07`: End customer is deceased. \

              `MS03`: Reason has not been specified by agent. \

              `RC11`: Intermediary Agent is invalid or missing.

              '
            enum:
            - AB01
            - AB02
            - AB03
            - AB05
            - AB08
            - AC03
            - AC05
            - AC06
            - AC07
            - AC08
            - AC10
            - AC11
            - AC13
            - AC14
            - AC15
            - AG01
            - AG10
            - AG11
            - AM04
            - AM14
            - AM23
            - BE01
            - BE04
            - BE05
            - BE06
            - BE15
            - BE17
            - BE20
            - BE21
            - BE22
            - DU01
            - DU03
            - FF02
            - MD07
            - MS03
            - RC11
          reasonDescription:
            type: string
            description: Readable description of the reason code.
        required:
        - identifier
