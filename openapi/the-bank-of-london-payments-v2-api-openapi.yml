openapi: 3.2.0
info:
  title: Bank of London Payments V2 API
  version: 2.0.0
  description: ''
servers:
- description: Sandbox
  url: https://sandbox-api.bankoflondon.com/
- description: Live
  url: https://api.bankoflondon.com/
- description: Mock Server
  url: https://developer.bankoflondon.com/api/mock/the-bank-of-london-api
tags:
- name: Payments V2
paths:
  /v2/fx-quotes:
    post:
      operationId: CreateAnFXQuoteV2
      summary: Create an FX Quote
      description: '**Attention** \

        This endpoint requires specific permissions and is restricted to clients who have been granted access. If you would like to avail of this functionality, please reach out to our customer service team at client.partners@thebankoflondon.com to enable this functionality.


        Creates a guaranteed rate quote for a specific time period.

        This endpoint provides real-time foreign exchange rates,

        ensuring accurate and reliable pricing for your FX transactions.


        The quote will include an exchange rate, quote ID for future reference,

        and expiration time indicating how long the rate is guaranteed.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnFXQuoteRequest'
            examples:
              buyRequest:
                summary: Buy Request - Specify amount to buy.
                description: Request where you specify the amount you want to buy (USD 10,000) and the system calculates how much GBP you need to sell
                value:
                  sell:
                    currency: GBP
                  buy:
                    currency: USD
                    amount: '10000.00'
              sellRequest:
                summary: Sell Request - Specify amount to sell
                description: Request where you specify the amount you want to sell (GBP 8,500) and the system calculates how much USD you will receive
                value:
                  sell:
                    currency: GBP
                    amount: '8500.00'
                  buy:
                    currency: USD
      responses:
        '200':
          description: Quote created successfully
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnFXQuoteResponse'
              example:
                quoteId: j0zMRPAN_Kl5WbKwAAe5A
                sell:
                  currency: GBP
                  amount: '7843.14'
                buy:
                  currency: USD
                  amount: '10000.00'
                exchangeRate: '1.2750'
                expiresAtDateTime: '2024-06-16T15:30:00.000Z'
                createdDateTime: '2024-06-16T10:25:50.000Z'
                quoteType: BUY
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/fx-quotes/{quoteId}:
    get:
      operationId: GetAnFXQuoteV2
      summary: Get an FX Quote
      description: '**Attention** \

        This endpoint requires specific permissions and is restricted to clients who have been granted access. If you would like to avail of this functionality, please reach out to our customer service team at client.partners@thebankoflondon.com to enable this functionality.


        Retrieves a previously generated foreign exchange quote by its ID.

        This endpoint allows you to access the details of a specific FX quote,

        including the exchange rate, amounts involved, and expiration time.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      - in: path
        name: quoteId
        required: true
        schema:
          $ref: '#/components/schemas/QuoteId'
      responses:
        '200':
          description: Quote retrieved successfully
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnFXQuoteResponse'
              example:
                quoteId: j0zMRPAN_Kl5WbKwAAe5A
                sell:
                  currency: GBP
                  amount: '7843.14'
                buy:
                  currency: USD
                  amount: '10000.00'
                exchangeRate: '1.2750'
                expiresAtDateTime: '2024-06-16T15:30:00.000Z'
                createdDateTime: '2024-06-16T10:25:50.000Z'
                quoteType: BUY
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/payments/internal:
    post:
      operationId: CreateAnInternalPayment
      summary: Create an Internal Payment
      description: 'This operation initiates a payment in the context of

        an application registered with Bank of London Developer Studio. It takes a request body

        that contains all the necessary information required to issue a single internal payment.


        All payments must originate from a Bank of London account (`sender` field).

        The `recipient` field must be a Bank of London account ID that is owned by the requesting account holder, otherwise the request will be rejected.

        A customer can only transfer between two of their own accounts eg. Operating Account → Client Collateral Account.


        ## Single Internal Debit Payment


        The API will return the ID of the created payment along with its

        status after initiation. The ID can be used to retrieve the payment

        details (`GET /payments/{paymentId}`) including its current status in the

        future.


        ## Immediate and Future Payments


        Providing `plannedExecutionDateTime` for `INTERNAL_DEBIT` payment will schedule a future payment whereas omitting the

        `plannedExecutionDateTime` will result in an immediate payment.


        The consumer application (identified by the API key) must always have

        the permission to execute payments from the sender''s account.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Internal Payment Request
                description: Payment object that is required to initiate a single Internal Debit payment.
                properties:
                  type:
                    type: string
                    description: Represents an immediate or future dated Internal payment.
                    enum:
                    - INTERNAL_DEBIT
                  sender:
                    $ref: '#/components/schemas/PaymentSender'
                  recipient:
                    $ref: '#/components/schemas/PaymentRecipientTbol'
                  amount:
                    $ref: '#/components/schemas/PaymentAmount'
                  reference:
                    $ref: '#/components/schemas/PaymentReferenceRequest'
                  notes:
                    $ref: '#/components/schemas/PaymentNotes'
                  plannedExecutionDateTime:
                    $ref: '#/components/schemas/PlannedPaymentExecutionDateTime'
                  idempotencyId:
                    $ref: '#/components/schemas/IdempotencyId'
                required:
                - type
                - sender
                - recipient
                - amount
                - reference
                - idempotencyId
      responses:
        '202':
          description: "Accepted\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** in the future without a major version change. Please ensure this is factored into your\napplication code.</span>\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InternalSinglePayment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/PaymentUnauthorizedError'
        '403':
          $ref: '#/components/responses/PaymentForbiddenError'
        '404':
          $ref: '#/components/responses/BankAccountNotFoundError'
        '409':
          $ref: '#/components/responses/ErrorResponseConflictIdempotencyId'
        '422':
          $ref: '#/components/responses/CreateInternalPaymentUnprocessableError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/payments/faster-payment:
    post:
      operationId: CreateAFasterPayment
      summary: Create a Faster Payment
      description: 'This operation initiates a payment in the context of

        an application registered with Bank of London Developer Studio. It takes a request body

        that contains all the necessary information required to issue a single payment.


        All payments must originate from a Bank of London account (`sender` field)

        and can be transferred to either a Bank of London account or any UK domestic

        account of another bank.


        ## Single FPS Debit Payment


        The API will return the ID of the created payment along with its

        status after initiation. The ID can be used to retrieve the payment

        details (`GET /payments/{paymentId}`) including its current status in the

        future.


        ## Immediate and Future Payments


        Providing `plannedExecutionDateTime` for `FPS_DEBIT` payment will schedule a future payment whereas omitting the

        `plannedExecutionDateTime` will result in an immediate payment.


        The consumer application (identified by the API key) must always have

        the permission to execute payments from the sender''s account.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: FPS Payment Request
                description: Payment object that is required to initiate a single FPS Debit payment.
                properties:
                  type:
                    type: string
                    description: Represents an immediate or future dated FPS payment.
                    enum:
                    - FPS_DEBIT
                  sender:
                    $ref: '#/components/schemas/PaymentSender'
                  recipient:
                    $ref: '#/components/schemas/PaymentRecipient'
                  amount:
                    $ref: '#/components/schemas/PaymentAmount'
                  reference:
                    $ref: '#/components/schemas/PaymentReferenceRequest'
                  notes:
                    $ref: '#/components/schemas/PaymentNotes'
                  plannedExecutionDateTime:
                    $ref: '#/components/schemas/PlannedPaymentExecutionDateTime'
                  idempotencyId:
                    $ref: '#/components/schemas/IdempotencyId'
                required:
                - type
                - sender
                - recipient
                - amount
                - reference
                - idempotencyId
      responses:
        '202':
          description: "Accepted\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** in the future without a major version change. Please ensure this is factored into your\napplication code.</span>\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FPSSinglePayment'
                - $ref: '#/components/schemas/InternalSinglePayment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/PaymentUnauthorizedError'
        '403':
          $ref: '#/components/responses/PaymentForbiddenError'
        '404':
          $ref: '#/components/responses/BankAccountNotFoundError'
        '409':
          $ref: '#/components/responses/ErrorResponseConflictIdempotencyId'
        '422':
          $ref: '#/components/responses/CreateFPSUnprocessableError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/payments/bacs:
    post:
      operationId: CreateABacsPayment
      summary: Create a Bacs Payment
      description: 'This operation initiates a Bacs payment in the context of

        an application registered with Bank of London Developer Studio. It takes a request body

        that contains all the necessary information required to issue either a

        single or a standing order Bacs payment. The `type` field serves as a discriminator.


        Bacs operates on a 3 working day cycle between Monday to Friday. The scheme does not operate on weekends and Bank holidays (England & Wales).


        On successful acceptance and processing of your payments, funds will be held in your account on Day 1 and will typically be credited to the recipient''s account on Day 3.


        You can recall a Bacs payment only up to 5.30PM on the day you initiate the payment; for any recalls, please contact the customer service team by email: `uksupport@thebankoflondon.com` or call us on `+44 3301 659 131`


        All payments must originate from a Bank of London account (`sender` field)

        and can be transferred to any UK domestic account of another bank.


        The consumer application (identified by the API key) must always have

        the permission to execute payments from the sender''s account.


        ## Single Bacs Debit Payment


        The API will return the ID of the created payment along with its

        status after initiation. The ID can be used to retrieve the payment

        details (`GET /payments/{paymentId}`) including its current status in the

        future.


        ## Immediate and Future Payments


        Providing a future date for `plannedExecutionDate` for `BACS_DEBIT` payment will schedule a future payment. Providing today''s date for `plannedExecutionDate` will result in an immediate payment.


        Payments are processed in the Europe/London timezone so `plannedExecutionDate` must be a UK date in the format `YYYY-MM-DD`.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BacsDebitPaymentRequest'
      responses:
        '202':
          description: "Accepted\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** in the future without a major version change. Please ensure this is factored into your\napplication code.</span>\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BacsSinglePayment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/PaymentUnauthorizedError'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/BankAccountNotFoundError'
        '409':
          $ref: '#/components/responses/ErrorResponseConflictIdempotencyId'
        '422':
          $ref: '#/components/responses/CreateBacsPaymentUnprocessableError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/payments/chaps:
    post:
      operationId: CreateACHAPSPayment
      summary: Create a CHAPS Payment
      description: 'This operation initiates a CHAPS payment in the context of

        an application registered with Bank of London Developer Studio. It takes a request body

        that contains all the necessary information required to issue a

        single CHAPS payment.


        CHAPS operates same day processing between Monday to Friday; our current cut off for same day payment is 4:00 PM,

        and payments submitted after this cut-off time will be processed the next working day. The scheme does not

        operate on weekends and bank holidays (England & Wales).


        Please ensure that any CHAPS payments are only made on your behalf and not on behalf of your clients

        (if applicable).


        Virtual Accounts cannot be used for CHAPS payments.


        TBOL uses an agency bank to process CHAPS payments on its behalf; CHAPS payments cannot be reversed. If you need

        any assistance, please contact us as soon as possible at uksupport@thebankoflondon.com or call us on

        +443301 659 131


        ## Single CHAPS Payment


        The API will return details of the created payment along with its status after initiation. The ID can be used to

        retrieve the payment details (`GET /payments/{paymentId}`) including its current status in the future.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: CHAPS Payment Request
                description: Payment object that is required to initiate a single CHAPS payment.
                properties:
                  type:
                    type: string
                    description: Represents an immediate or future dated CHAPS payment.
                    enum:
                    - CHAPS_DEBIT
                  sender:
                    $ref: '#/components/schemas/PaymentSender'
                  recipient:
                    $ref: '#/components/schemas/PaymentRecipient'
                  amount:
                    $ref: '#/components/schemas/ChapsPaymentAmount'
                  reference:
                    $ref: '#/components/schemas/PaymentReferenceRequest'
                  notes:
                    $ref: '#/components/schemas/PaymentNotes'
                  plannedExecutionDateTime:
                    $ref: '#/components/schemas/PlannedChapsPaymentExecutionDateTime'
                  idempotencyId:
                    $ref: '#/components/schemas/IdempotencyId'
                required:
                - type
                - sender
                - recipient
                - amount
                - reference
                - idempotencyId
      responses:
        '202':
          description: Accepted
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CHAPSSinglePayment'
        '400':
          $ref: '#/components/responses/CreateChapsBadRequestError'
        '401':
          $ref: '#/components/responses/PaymentUnauthorizedError'
        '403':
          $ref: '#/components/responses/PaymentForbiddenError'
        '404':
          $ref: '#/components/responses/BankAccountNotFoundError'
        '409':
          $ref: '#/components/responses/ErrorResponseConflictIdempotencyId'
        '422':
          $ref: '#/components/responses/CreateChapsPaymentUnprocessableError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/payments/agency:
    post:
      operationId: CreateAgencyPayment
      summary: Create an Agency Payment
      description: '**Attention** \

        This endpoint requires specific permissions and is restricted to clients who have been granted access.


        This operation initiates a payment in the context of

        an application registered with Bank of London Developer Studio. It takes a request body

        that contains all the necessary information required to issue a single payment.


        This endpoint is used to initiate a Faster Payment (FPS) on behalf of your end customer,

        where you (the agency client) are not the actual payer, but act as the conduit for clearing and settlement via the Bank of London.

        This model supports regulated financial institutions that offer embedded payment services to their own customers - such as fintech platforms,

        EMIs, or payment institutions - without requiring direct access to UK payment schemes.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Nested Payment Request
                description: Payment object that is required to initiate a single Nested Debit payment.
                properties:
                  type:
                    type: string
                    enum:
                    - FPS_DEBIT
                  paymentType:
                    $ref: '#/components/schemas/PaymentType'
                  sender:
                    $ref: '#/components/schemas/PaymentSender'
                  recipient:
                    $ref: '#/components/schemas/PaymentRecipient'
                  originator:
                    $ref: '#/components/schemas/PaymentOriginator'
                  amount:
                    $ref: '#/components/schemas/PaymentAmount'
                  reference:
                    $ref: '#/components/schemas/PaymentReferenceRequest'
                  notes:
                    $ref: '#/components/schemas/PaymentNotes'
                  idempotencyId:
                    $ref: '#/components/schemas/IdempotencyId'
                required:
                - type
                - paymentType
                - sender
                - recipient
                - originator
                - amount
                - reference
                - idempotencyId
      responses:
        '202':
          description: "Accepted\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** in the future without a major version change. Please ensure this is factored into your\napplication code.</span>\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InternalSinglePayment'
                - $ref: '#/components/schemas/FPSSinglePayment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/PaymentUnauthorizedError'
        '403':
          $ref: '#/components/responses/PaymentForbiddenError'
        '404':
          $ref: '#/components/responses/BankAccountNotFoundError'
        '409':
          $ref: '#/components/responses/ErrorResponseConflictIdempotencyId'
        '422':
          $ref: '#/components/responses/CreateFPSUnprocessableError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
  /v2/payments:
    post:
      operationId: CreatePaymentV2
      summary: Create a Cross-border Payment
      description: '**Attention** \

        This endpoint requires specific permissions and is restricted to clients who have been granted access. If you would like to avail of this functionality, please reach out to our customer service team at client.partners@thebankoflondon.com to enable this functionality.


        This operation initiates a cross-border payment in the context of

        an application registered with Bank of London Developer Studio. It takes a request body

        that contains all the necessary information required to issue a

        cross-border payment.'
      parameters:
      - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CrossBorderPaymentRequest'
            examples:
              DirectCrossBorderPayment:
                summary: Direct Cross-border Payment (USD to US Bank)
                value:
                  scheme: CROSSBORDER
                  debtor:
                    account:
                      accountId: GB-040075-12345678
                  amount:
                    currency: USD
                    value: '10000.50'
                  creditorAgent:
                    bic: CHASUS33XXX
                  creditor:
                    name: John Doe International Inc
                    postalAddress:
                      townName: New York
                      country: US
                    account:
                      iban: GB29NWBK60161331926819
                  reference:
                    unstructured: Cross-border invoice payment for international services - USD transfer to US bank
                  quoteId: 03967d18-5152-4f5a-9276-7f96c96f05ba
                  endToEndId: R5T-8WV2.N9K+L4M7
                  idempotencyId: 32ed5f75-638e-454c-a91b-ec16dc8f6e84
      responses:
        '202':
          description: "Accepted\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** in the future without a major version change. Please ensure this is factored into your\napplication code.</span>\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CrossBorderPaymentResponse'
              examples:
                DirectCrossBorderPaymentResponse:
                  summary: Direct Cross-border Payment Response (USD to US Bank via BIC)
                  value:
                    id: FItJ8s2G-aOUfXUFqzRXE
                    scheme: CROSSBORDER
                    debtor:
                      account:
                        accountId: GB-040075-12345678
                    amount:
                      currency: USD
                      value: '10000.50'
                    creditorAgent:
                      bic: CHASUS33XXX
                    creditor:
                      name: John Doe International Inc
                      postalAddress:
                        townName: New York
                        country: US
                      account:
                        iban: GB29NWBK60161331926819
                    reference:
                      unstructured: Cross-border invoice payment for international services - USD transfer to US bank
                    quoteId: 03967d18-5152-4f5a-9276-7f96c96f05ba
                    fxDetails:
                      exchangeRate: '1.2345'
                      sell:
                        currency: GBP
                        amount: '8100.41'
                      buy:
                        currency: USD
                        amount: '10000.50'
                    status:
                      identifier: PENDING
                    createdDateTime: '2024-11-01T12:15:00.000+00:00'
                    endToEndId: XB7K-9M2P.Q4R8+W3N5
                    plannedExecutionDate: '2024-11-01'
                    idempotencyId: 32ed5f75-638e-454c-a91b-ec16dc8f6e84
                    creator:
                      type: API
                      key: 03967d18-5152-4f5a-9276-7f96c96f05ba
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/PaymentUnauthorizedError'
        '403':
          $ref: '#/components/responses/PaymentForbiddenError'
        '404':
          $ref: '#/components/responses/BankAccountNotFoundError'
        '409':
          $ref: '#/components/responses/ErrorResponseConflictIdempotencyId'
        '422':
          $ref: '#/components/responses/CreateCrossBorderUnprocessableError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/PaymentServiceUnavailableError'
      tags:
      - Payments V2
    get:
      operationId: GetPayments
      summary: Get Payments
      description: 'Retrieves a list of payment requests in the context of a consumer

        application.


        Payments must be filtered using the `accountId` query parameter.

        There are also optional query parameters available for further filtering.


        Payment requests may be just initiated or may have been in progress for

        a while. The API returns their current status along with the payment ID

        (`id`) to be able to retrieve a specific payment request later via `GET

        /payments/{paymentId}`.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - in: query
        name: accountId
        required: true
        schema:
          $ref: '#/components/schemas/AccountId'
      - in: query
        name: createdDateFrom
        required: false
        schema:
          type: string
          description: The oldest date from which the payments will be provided.
          format: date
          example: '2022-10-06'
      - in: query
        name: createdDateTo
        required: false
        schema:
          type: string
          description: The most recent date from which the payments will be provided.
          format: date
          example: '2022-10-01'
      - in: query
        name: plannedExecutionDateFrom
        required: false
        schema:
          type: string
          description: The oldest date from which the payments will be provided based on the plannedExecutionDate.
          format: date
          example: '2022-10-06'
      - in: query
        name: plannedExecutionDateTo
        required: false
        schema:
          type: string
          description: The most recent date from which the payments will be provided based on the plannedExecutionDate.
          format: date
          example: '2022-10-01'
      - in: query
        name: scheme
        required: false
        schema:
          $ref: '#/components/schemas/PaymentScheme'
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStatusQueryParam'
      - in: query
        name: amount
        required: false
        description: The amount value of the payment.
        schema:
          $ref: '#/components/schemas/value'
      - in: query
        name: reference
        required: false
        description: 'Reference note that is sent along with the payment and usually contains

          personal or business related information. This is visible to the sender

          and the recipient. This is a query against the full reference text and is case insensitive.'
        schema:
          $ref: '#/components/schemas/PaymentReferenceRequest'
      - in: query
        name: type
        required: false
        description: The type of payment.
        schema:
          $ref: '#/components/schemas/PaymentTypeQueryParam'
      - in: query
        name: idempotencyId
        required: false
        schema:
          type: string
          description: The idempotency ID associated with a payment.
          example: 32ed5f75-638e-454c-a91b-ec16dc8f6e84
      - in: query
        name: standingOrderId
        required: false
        schema:
          $ref: '#/components/schemas/PaymentStandingOrderId'
      - in: query
        name: endToEndId
        required: false
        schema:
          $ref: '#/components/schemas/CrossBorderEndToEndId'
      - $ref: '#/components/parameters/JwsSignature'
      responses:
        '200':
          description: "Success\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf payments in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** and **scheme**\nin the future without a major version change. Please ensure this is factored into your application code.\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/InternalSinglePayment'
                      - $ref: '#/components/schemas/FPSSinglePayment'
                      - $ref: '#/components/schemas/CHAPSSinglePayment'
                      - $ref: '#/components/schemas/BacsSinglePayment'
                      - $ref: '#/components/schemas/CrossBorderPaymentResponse'
                  metadata:
                    $ref: '#/components/schemas/MetaData'
                required:
                - payments
                - metadata
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '504':
          $ref: '#/components/responses/504'
      tags:
      - Payments V2
  /v2/payments/{paymentId}:
    get:
      operationId: GetPayment
      summary: Get Payment
      description: Retrieves a single payment by its ID `paymentId`.
      parameters:
      - in: path
        name: paymentId
        required: true
        schema:
          $ref: '#/components/schemas/PaymentId'
      - $ref: '#/components/parameters/JwsSignature'
      responses:
        '200':
          description: "Success\n\n<span style=\"color:#f46d2a; font-size:14px; font-family:Inter;\">**Attention**</span> \\\n<span style=\"font-size:14px; font-family:Inter;\">Please note that the oneOf payments in the **body** below, is extensible and new objects can be \nreturned with a new payment **type** and **scheme**\nin the future without a major version change. Please ensure this is factored into your application code.\n"
          headers:
            x-correlation-id:
              description: A unique identifier assigned to each request, facilitating issue tracing. In the event that a problem arises with a request, this ID can be provided to Bank of London support team for assistance.
              schema:
                type: string
              example: '2579248247516384065'
              required: true
          content:
            application/json:
              schema:
                type: object
                oneOf:
                - $ref: '#/components/schemas/InternalSinglePayment'
                - $ref: '#/components/schemas/FPSSinglePayment'
                - $ref: '#/components/schemas/CHAPSSinglePayment'
                - $ref: '#/components/schemas/BacsSinglePayment'
                - $ref: '#/components/schemas/CrossBorderPaymentResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/PaymentNotFound'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Payments V2
components:
  schemas:
    BacsExecutionDateTime:
      type:
      - string
      - 'null'
      description: The UTC date time detailing when the payment will settle. This field is populated once the payment has successfully passed our checks and prepared for the payment scheme.
      format: date-time
      example: '2022-10-05T11:01:00.000Z'
    FPSSinglePayment:
      type: object
      title: FPS Payment
      description: 'Payment object that represents a FPS payment.

        '
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        type:
          $ref: '#/components/schemas/FPSDebitPaymentType'
        scheme:
          $ref: '#/components/schemas/FPSPaymentScheme'
        sender:
          $ref: '#/components/schemas/PaymentSenderResponse'
        recipient:
          $ref: '#/components/schemas/PaymentRecipientFPSResponse'
        amount:
          $ref: '#/components/schemas/PaymentAmount'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        notes:
          $ref: '#/components/schemas/PaymentNotes'
        plannedExecutionDateTime:
          $ref: '#/components/schemas/PlannedPaymentExecutionDateTime'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        executionDateTime:
          $ref: '#/components/schemas/ExecutionDateTime'
        createdDateTime:
          $ref: '#/components/schemas/CreatedDateTime'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
        paymentOrderId:
          $ref: '#/components/schemas/PaymentOrderId'
        idempotencyId:
          $ref: '#/components/schemas/IdempotencyId'
        standingOrderId:
          $ref: '#/components/schemas/PaymentStandingOrderId'
        creator:
          $ref: '#/components/schemas/PaymentCreator'
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        originator:
          $ref: '#/components/schemas/PaymentOriginator'
      required:
      - id
      - type
      - scheme
      - sender
      - recipient
      - amount
      - reference
      - status
      - createdDateTime
      - createdBy
      - idempotencyId
      - creator
    AccountId:
      type: string
      description: Bank of London account ID identifies the account within Bank of London API. This field is considered a unique ID and cannot be constructed using the account number and sort code. As such it must only be provided with `accountId` values returned by Bank of London Account API.
      example: GB-040075-12345678
    CrossBorderEndToEndId:
      type: string
      description: "Unique identifier that must be unique for the entire end-to-end payment journey.\nThis identifier is used to track the payment across all systems and institutions \ninvolved in the cross-border payment process. While a format is not required, it is strongly recommended to ensure global uniqueness across \nall payment networks and correspondent banks.\n"
      minLength: 1
      maxLength: 35
      pattern: ^[0-9a-zA-Z/\-?:().,'+ ]+$
      example: F8N-3KL9.M7P+Q2X6
    PaymentAmount:
      allOf:
      - description: The amount to be paid from the senders account to the recipient's account.
      - $ref: '#/components/schemas/Amount'
    PaymentScheme:
      type: string
      description: '<span style="color:#f46d2a">**Attention**</span> \

        Please note that the allowed values for the **scheme** are

        extensible and new values can be added in the future without a

        major version change. Please ensure this is factored into your

        application code.


        Payment scheme. \

        `FPS`: Faster payment \

        `INTERNAL`: Internal payment between accounts  \

        `BACS`: Bankers'' automated clearing system \

        `CHAPS`: Clearing house automated payment system \

        `CROSSBORDER`: Cross-border payment`

        '
      enum:
      - FPS
      - INTERNAL
      - BACS
      - CHAPS
      - CROSSBORDER
    CrossBorderPaymentRequest:
      oneOf:
      - $ref: '#/components/schemas/CrossBorderDirectPaymentRequest'
    PostalAddressTownLocationName:
      type: string
      description: Town location name
      minLength: 1
      maxLength: 35
      pattern: ^[0-9a-zA-Z/\-?:().,'+ !#$%&*=^_`{|}~";<>@[\\\]]+$
      example: New York
    FXQuoteBuyRequest:
      type: object
      title: FX Quote Buy Request
      description: "Request where you specify the amount you want to buy. The system will \ncalculate how much you need to sell in the source currency.\n"
      properties:
        sell:
          type: object
          description: Sell details specifying the source currency
          properties:
            currency:
              $ref: '#/components/schemas/QuoteSellCurrency'
          required:
          - currency
        buy:
          type: object
          description: Buy details with the amount you want to buy
          properties:
            currency:
              $ref: '#/components/schemas/QuoteBuyCurrency'
            amount:
              $ref: '#/components/schemas/BuyAmount'
          required:
          - currency
          - amount
      required:
      - sell
      - buy
    CrossBorderPlannedExecutionDate:
      type: string
      description: "Date on which the payment has to be executed \n(ISO 8601 YYYY-MM-DD format -> e.g., 2025-06-16).\nSystem generated.\n"
      format: date
      example: '2025-06-16'
    CrossBorderCreditorAgent:
      description: 'Creditor Agent''s Business Identifier Code.

        Either BIC or Other identification must be present.

        '
      oneOf:
      - type: object
        title: BIC
        properties:
          bic:
            $ref: '#/components/schemas/FinancialInstitutionBIC'
        required:
        - bic
      - type: object
        title: Other
        properties:
          country:
            $ref: '#/components/schemas/CreditorAgentCountry'
          bankIdentifier:
            $ref: '#/components/schemas/CreditorAgentBankIdentifier'
        required:
        - country
        - bankIdentifier
    PlannedChapsPaymentExecutionDateTime:
      type:
      - string
      - 'null'
      description: The date when the payment should be executed by Bank of London. Today's date or the next working day can be provided. The date time should be formatted to the UTC date format (ISO8601). The time element will be ignored on the date time. `2022-10-05T11:01:00.000Z` is a valid example. If no date time is provided, this will be defaulted to the current date at midnight.
      format: date-time
      example: '2022-10-05T11:01:00.000Z'
    CreatedDateTime:
      type: string
      description: The UTC date time when the payment was created `2022-10-05T11:01:00.000Z` is a valid example.
      format: date-time
      example: '2022-10-05T11:01:00.000Z'
    PaymentCreator:
      oneOf:
      - $ref: '#/components/schemas/PaymentCreatorUser'
      - $ref: '#/components/schemas/PaymentCreatorApi'
      - $ref: '#/components/schemas/PaymentCreatorSystem'
    IdempotencyId:
      type: string
      description: Idempotency ID is a unique identifier that will guarantee that a payment or standing order containing a specific ID will be processed only once.
      example: 32ed5f75-638e-454c-a91b-ec16dc8f6e84
      minLength: 5
      maxLength: 72
    PaymentRecipientTbolResponse:
      description: "<span style=\"color:#f46d2a\">**Attention**</span> \\\nPlease note that the recipient is a oneOf object linked to the **type** in the object. \nCurrently `TBOL` is the only available oneOf object\nbut the **recipient** oneOf is extensible and new recipient types can be added in the future without a\nmajor version change. Please ensure this is factored into your\napplication code.\n\nRepresents the details of the payment recipient.\n"
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/AccountIdentifierTbolResponse'
    PaymentCreatorKey:
      type: string
      description: The API key that created the payment.
      example: 03967d18-5152-4f5a-9276-7f96c96f05ba
    PaymentSender:
      description: "<span style=\"color:#f46d2a\">**Attention**</span> \\\nPlease note that the sender is a oneOf object linked to the **type** in the object. \nCurrently `TBOL` is the only available oneOf object\nbut the **sender** oneOf is extensible and new sender types can be added in the future without a\nmajor version change. Please ensure this is factored into your\napplication code.\n\nRepresents the details of the payment sender.\n"
      allOf:
      - $ref: '#/components/schemas/AccountIdentifierTbol'
    ExecutionDateTime:
      type:
      - string
      - 'null'
      description: The UTC date time when the payment was executed. This field is only populated once the payment has been settled and status identifier is `SUCCESSFUL`.
      format: date-time
      example: '2022-10-05T11:01:00.000Z'
    CrossBorderQuoteId:
      type: string
      description: 'Quote Id is not a required field for cross-border payments. \

        A Quote Id can be provided by the FX quote API, in order to guarantee the rate. The quoteId must not be expired and must align to the details provided in the payment request, i.e., the amount.

        '
      example: V1StGXR8_Z5jdHi6B-myT
    UkSortCode:
      type: string
      description: A 6-digit identification number of the bank branch holding the account.
      example: '123456'
      minLength: 6
      maxLength: 6
    CHAPSSinglePayment:
      type: object
      title: CHAPS Payment
      description: 'Payment object that is required to initiate a CHAPS payment.

        '
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        type:
          $ref: '#/components/schemas/CHAPSDebitPaymentType'
        scheme:
          $ref: '#/components/schemas/CHAPSPaymentScheme'
        sender:
          $ref: '#/components/schemas/PaymentSenderResponse'
        recipient:
          $ref: '#/components/schemas/PaymentRecipient'
        amount:
          $ref: '#/components/schemas/ChapsPaymentAmount'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        notes:
          $ref: '#/components/schemas/PaymentNotes'
        plannedExecutionDateTime:
          $ref: '#/components/schemas/PlannedChapsPaymentExecutionDateTime'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        executionDateTime:
          $ref: '#/components/schemas/ExecutionDateTime'
        createdDateTime:
          $ref: '#/components/schemas/CreatedDateTime'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
        paymentOrderId:
          $ref: '#/components/schemas/PaymentOrderId'
        idempotencyId:
          $ref: '#/components/schemas/IdempotencyId'
        creator:
          $ref: '#/components/schemas/PaymentCreator'
      required:
      - id
      - type
      - scheme
      - sender
      - recipient
      - amount
      - reference
      - status
      - createdDateTime
      - createdBy
      - idempotencyId
      - creator
    PostalAddressTownName:
      type: string
      description: Town name (mandatory for postal address)
      minLength: 1
      maxLength: 35
      pattern: ^[0-9a-zA-Z/\-?:().,'+ !#$%&*=^_`{|}~";<>@[\\\]]+$
    AccountIdentifierUk:
      type: object
      title: UK
      properties:
        type:
          type: string
          enum:
          - UK
        sortCode:
          $ref: '#/components/schemas/UkSortCode'
        accountNumber:
          $ref: '#/components/schemas/UkAccountNumber'
        accountHolderName:
          $ref: '#/components/schemas/AccountHolderName'
      required:
      - type
      - sortCode
      - accountNumber
      - accountHolderName
    PostalAddressSubDepartment:
      type: string
      description: Sub-department information
      minLength: 1
      maxLength: 70
      pattern: ^[0-9a-zA-Z/\-?:().,'+ !#$%&*=^_`{|}~";<>@[\\\]]+$
    PaymentType:
      type: string
      description: 'Represents payment type for agency payments.


        `SIP`: Single Immediate Payment \

        `FDP`: Forward Dated Payment \

        `SOP`: Standing Order Payment.

        '
      enum:
      - SIP
      - FDP
      - SOP
    CrossBorderReference:
      description: 'Reference for cross-border payments.

        Currently supports unstructured format only.

        '
      oneOf:
      - type: object
        title: Unstructured
        properties:
          unstructured:
            $ref: '#/components/schemas/UnstructuredReference'
        required:
        - unstructured
    CreateAnFXQuoteResponse:
      type: object
      title: Create an FX Quote Response
      properties:
        quoteId:
          $ref: '#/components/schemas/QuoteId'
        sell:
          type: object
          description: Sell details for FX quote
          properties:
            currency:
              $ref: '#/components/schemas/QuoteSellCurrency'
            amount:
              $ref: '#/components/schemas/SellAmount'
          required:
          - currency
          - amount
        buy:
          type: object
          description: Buy details for FX quote
          properties:
            currency:
              $ref: '#/components/schemas/QuoteBuyCurrency'
            amount:
              $ref: '#/components/schemas/BuyAmount'
          required:
          - currency
          - amount
        exchangeRate:
          $ref: '#/components/schemas/ExchangeRate'
        expiresAtDateTime:
          $ref: '#/components/schemas/QuoteExpiresAtDateTime'
        createdDateTime:
          $ref: '#/components/schemas/QuoteCreatedDateTime'
        quoteType:
          $ref: '#/components/schemas/QuoteType'
      required:
      - quoteId
      - sell
      - buy
      - exchangeRate
      - expiresAtDateTime
      - createdDateTime
      - quoteType
    InternalSinglePayment:
      type: object
      title: Internal Payment
      description: 'Payment object that represents an Internal payment.

        '
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        type:
          $ref: '#/components/schemas/InternalDebitPaymentType'
        scheme:
          $ref: '#/components/schemas/InternalPaymentScheme'
        sender:
          $ref: '#/components/schemas/PaymentSenderResponse'
        recipient:
          $ref: '#/components/schemas/PaymentRecipientTbolResponse'
        amount:
          $ref: '#/components/schemas/PaymentAmount'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        notes:
          $ref: '#/components/schemas/PaymentNotes'
        plannedExecutionDateTime:
          $ref: '#/components/schemas/PlannedPaymentExecutionDateTime'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        executionDateTime:
          $ref: '#/components/schemas/ExecutionDateTime'
        createdDateTime:
          $ref: '#/components/schemas/CreatedDateTime'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
        paymentOrderId:
          $ref: '#/components/schemas/PaymentOrderId'
        idempotencyId:
          $ref: '#/components/schemas/IdempotencyId'
        standingOrderId:
          $ref: '#/components/schemas/PaymentStandingOrderId'
        creator:
          $ref: '#/components/schemas/PaymentCreator'
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        originator:
          $ref: '#/components/schemas/PaymentOriginator'
      required:
      - id
      - type
      - scheme
      - sender
      - recipient
      - amount
      - reference
      - status
      - createdDateTime
      - createdBy
      - idempotencyId
      - creator
    RedirectedAccountNumber:
      type: string
      description: 'Provided along with `redirectedSortCode` if the original payment was redirected to a different account than originally instructed, due to the recipient’s account switch to a different provider (using Current Account Switch Service). Please ensure that any payee records, Standing Orders or future dated payments are updated to reflect these new details.

        '
    ConflictError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseJSON'
      - properties:
          status:
            enum:
            - 409
          name:
            enum:
            - Conflict
          message:
            example: Resource already exists
    CrossBorderCreditorAccount:
      description: 'IBAN details for the creditor account or account number.


        **Important Conditional Requirements:**

        - If Other is selected for creditorAgent, then IBAN cannot be selected for creditor account. Only accountNumber is allowed.

        - If BIC is selected for creditorAgent, then either IBAN or accountNumber can be used for creditor account.

        '
      oneOf:
      - type: object
        title: IBAN
        description: '<span style="color:#f46d2a">**Attention**</span> \

          Use only when **creditorAgent** uses **BIC** identification

          '
        properties:
          iban:
            $ref: '#/components/schemas/CrossBorderAccountIBAN'
        required:
        - iban
      - type: object
        title: Account Number
        description: '<span style="color:#f46d2a">**Attention**</span> \

          Use when **creditorAgent** uses **Other** or **BIC** identification

          '
        properties:
          accountNumber:
            $ref: '#/components/schemas/CrossBorderAccountOther'
        required:
        - accountNumber
    BacsPaymentScheme:
      type: string
      enum:
      - BACS
      description: 'Payment scheme.

        `BACS`: Bacs payment

        '
    PaymentReferenceRequest:
      type: string
      description: Reference note that is sent along with the payment and usually contains personal or business related information. This is visible to the sender and the recipient. Reference should not contain profanities or the payment will be rejected.
      minLength: 2
      maxLength: 18
      example: INV-12345
    BuyAmount:
      type: string
      description: 'The amount being bought in the buy currency (accepts 0, 1, or 2 decimal places).

        '
      example: '10000.00'
      pattern: ^[0-9]+(\.[0-9]{1,2})?$
    PaymentTypeQueryParam:
      type: string
      description: Represents the type of payment.
      enum:
      - FPS_DEBIT
      - FPS_STANDING_ORDER_DEBIT
      - INTERNAL_DEBIT
      - INTERNAL_STANDING_ORDER_DEBIT
      - BACS_DEBIT
      - CHAPS_DEBIT
      - CROSSBORDER_DEBIT
    CHAPSPaymentScheme:
      type: string
      enum:
      - CHAPS
      description: 'Payment scheme.

        `CHAPS`: CHAPS payment

        '
    QuoteExpiresAtDateTime:
      type: string
      description: Quote expiration date time in ISO 8601 format. This indicates the time at which the quote will expire and is no longer valid. An cross-border payment must be created before the quote expires.
      format: date-time
      example: '2024-06-16T15:30:00.000Z'
    PlannedPaymentExecutionDateTime:
      type:
      - string
      - 'null'
      description: The date and time when the payment should be executed by The Bank of London. Future date and time up to 90 days can be provided to schedule a future payment. The date time should be formatted to the UTC date format (ISO8601). The time element is considered within 1 minute intervals, and payment will be released as close to the specified instructed time as possible. 2024-11-01T12:15:00.000Z is a valid example. If no date time is provided, this will be defaulted to the current date time.
      format: date-time
      example: '2024-11-01T11:10:00.000Z'
    PostalAddressDepartment:
      type: string
      description: Department information
      minLength: 1
      maxLength: 70
      pattern: ^[0-9a-zA-Z/\-?:().,'+ !#$%&*=^_`{|}~";<>@[\\\]]+$
    CreditorAgentCountry:
      type: string
      description: 'Country code (ISO) for the associated bank identifier provided.

        '
      minLength: 1
      maxLength: 2
      example: US
    ErrorResponseDetails:
