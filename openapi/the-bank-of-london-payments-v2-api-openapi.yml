      example: VkfAIi3VOVO3ssMGHmt6P
    PaymentStatusQueryParam:
      type: string
      description: "Payment statuses listed below can be used as query values. In order to query for \\\nmultiple statuses, the query param can be repeated \\\ne.g ...?status=PENDING&status=SUCCESSFUL \\\n \\\n`PENDING_APPROVAL`: Initial status of a payment that requires approval before processing. \\\n`PENDING`: Payment is currently being processed within Bank of London system.  \\\n`APPROVED`: The payment has been approved by an authorised payment approver  \\\n`REJECTED`: The payment has been rejected by an authorised payment approver  \\\n`SUCCESSFUL`: Payment has been processed and passed all checks.  \\\n`FAILED`: One or more checks failed whilst processing the payment.\n"
      enum:
      - PENDING_APPROVAL
      - PENDING
      - APPROVED
      - REJECTED
      - SUCCESSFUL
      - FAILED
    BacsSinglePaymentItem:
