      - status
      - createdDateTime
      - createdBy
      - idempotencyId
      - creator
    BacsDebitPaymentRequest:
      type: object
      title: Bacs Payment Request
      description: Payment object that is required to initiate a single Bacs Debit payment.
      properties:
        type:
          type: string
          description: Represents an immediate or future dated Bacs payment.
          enum:
          - BACS_DEBIT
        sender:
          $ref: '#/components/schemas/PaymentSender'
        payments:
          type: array
          description: 'Array of payment objects that represent a single Bacs payment item. For now, only one item in this array is supported. In the future, multiple payment items will be supported.

            '
