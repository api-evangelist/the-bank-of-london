    VirtualAccountCount:
      type: number
      description: A count of the Virtual Accounts under the virtual aggregator node. This includes those both directly and indirectly below the node.
      example: 201
    CloseVirtualAccountRequest:
      type: object
      title: Close Virtual Account Request
      description: Request object that is required to close a Virtual Account
      properties:
        closureReason:
          $ref: '#/components/schemas/PhysicalAccountClosureReason'
        recipient:
          description: 'Account details where the remaining balance of the

            closed account, any pending interest or transactions (if applicable)

            will be transferred to. The account must be within the same Virtual Account Hierarchy.

            It can be `VIRTUAL_ACCOUNT`, `VIRTUAL_SUSPENSE`, or `VIRTUAL_PANDL` account.

            If omitted, the remaining balance is automatically transferred to the

            `VIRTUAL_SUSPENSE` account in the same Virtual Account Hierarchy; no sort code,

            account number, or account holder name is required.


            <span style="color:#f46d2a">**Attention**</span>

            Please note that the recipient is a oneOf object linked to the **type** in the object.

            Currently `UK` is the only available oneOf object

            but the **recipient** oneOf is extensible and new recipient types can be added in the future without a

            major version change. Please ensure this is factored into your

            application code.


            Represents the details of the payment recipient.'
          allOf:
          - oneOf:
            - $ref: '#/components/schemas/AccountIdentifierForAccountClosureUk'
