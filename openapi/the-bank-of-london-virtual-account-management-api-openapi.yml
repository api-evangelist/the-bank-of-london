          $ref: '#/components/schemas/UpdateVirtualAccountAggregatorNodeId'
    TransactionAmount:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        value:
          type: number
          description: The amounts value assuming the provided unit under currency.
          format: double
          example: 4320.5
      required:
      - currency
      - value
    ForbiddenError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseJSON'
      - properties:
          status:
            enum:
            - 403
          name:
            enum:
            - Forbidden
          message:
            example: You do not have permission to access this resource
    UpdateAggregatorNodeRequest:
      type: object
