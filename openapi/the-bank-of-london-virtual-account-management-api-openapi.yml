      description: Request object that is required to update an aggregator node.
      properties:
        name:
          $ref: '#/components/schemas/AggregatorNodeName'
        parentVirtualAggregatorNodeId:
          $ref: '#/components/schemas/ParentAggregatorNodeId'
      oneOf:
      - properties:
          name:
            $ref: '#/components/schemas/AggregatorNodeName'
          parentVirtualAggregatorNodeId:
            $ref: '#/components/schemas/ParentAggregatorNodeId'
          owner:
            $ref: '#/components/schemas/AggregatorNodeAccountOwner'
    TransactionNotes:
      type:
      - string
      - 'null'
      description: An arbitrary string attached to the transaction. Max length is 140 characters.
      example: My transaction
    ExchangeRate:
      type: string
      description: 'FX rate rounded off to 4 decimal places

        '
      example: '1.2750'
      pattern: ^[0-9]+\.[0-9]{4}$
    ValidationError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseJSON'
      - properties:
          status:
            enum:
            - 422
          name:
            enum:
            - ValidationFailure
            - UnprocessableEntity
          message:
            example: Validation Failed
    NullableAccountOwner:
      type:
      - object
      - 'null'
      description: Owner of the account. When it is not specified the account will be owned directly by your organisation.
      properties:
        type:
          type: string
          description: '<span style="color:#f46d2a">**Attention**</span> \

            Please note that the allowed values for the **type** are

            extensible and new can be added in the future without a

            major version change. Please ensure this is factored into your

            application code.


            The type of owner

            '
          enum:
          - INDIVIDUAL
          - ORGANISATION
        id:
          type: string
          description: The owner's ID
          example: hkHcJybfBAKjZac9eiIAr
      required:
      - type
      - id
    TransactionReleaseDateTime:
      type:
      - string
      - 'null'
      description: The date when the transaction was released. This date is generally the same as the posting date unless the transaction was delayed awaiting approval.
      format: date-time
      example: '2022-10-07T08:55:33.213Z'
    CreateParentAggregatorNodeIdResponse:
      type: string
      description: ID of parent Virtual Aggregator Node as specified in the request. Where it wasn't specified in the request this is the ID of the default virtual aggregator node at the top of your hierarchy. Note, that for POST requests this value is always returned. However, this value can be `null` when sending GET request for the aggregator node at the top of your hierarchy. For more information see [Virtual Account Management](https://developer.tbol.com/docs/overviews/virtual-account-management).
      example: '0000000355'
    TransactionAccountIdentifierINTL:
      type: object
      title: INTL
      properties:
        type:
          type: string
          enum:
          - INTL
        accountHolderName:
          type: string
          description: Name of the account holder which is issuing or receiving a payment.
          example: Pay Ment
        iban:
          type:
          - string
          - 'null'
          description: Account identifier in an IBAN format
          example: GB98TBOL12345612345678
        accountNumber:
          type:
          - string
          - 'null'
          description: Account identifier of the sender. International account numbers supported which could be up to 34 characters.
        bic:
          type:
          - string
          - 'null'
          description: Bank Identifier Code.
      required:
      - type
      - accountHolderName
    FeeInterestTransactionV3:
