      type:
      - object
      - 'null'
      description: Limits applicable to the account.
      properties:
        minimumLimit:
          type:
          - number
          - 'null'
          description: The minimum balance for the account.
          format: double
          example: 0
    AggregatorNodeAccountOwner:
