        name:
          $ref: '#/components/schemas/AggregatorNodeName'
        parentVirtualAggregatorNodeId:
          $ref: '#/components/schemas/ParentAggregatorNodeId'
          description: The parent Virtual Aggregator Node ID. Note that if it is `null`, then this is the aggregator node at the top of your hierarchy, which has no parent. For more information see [Virtual Account Management](https://developer.tbol.com/docs/overviews/virtual-account-management).
      required:
      - id
      - headerAccountId
      - name
