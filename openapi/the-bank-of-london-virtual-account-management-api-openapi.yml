      description: In the UK, most bank account numbers consist of eight digits. Some UK banks have shorter account numbers, the number `0` should not be prefixed in those cases. Generally, an account number is only relevant in conjunction with a sort code.
      example: '12345678'
      minLength: 6
      maxLength: 8
    VirtualAccountAggregatorNodeId:
      type: string
      description: The id of virtual aggregator node, which can be used to retrieve all transactions for the associated Virtual Accounts.
      example: '0000000012'
    TransactionTypeDescription:
      type: string
      description: 'A short description of the transaction type.

        '
      example: Internal transfer
    TransactionFeeTypeV3:
      type: string
      description: '<span style="color:#f46d2a">**Attention**</span> \

        Please note that the allowed values for the **type** are

        extensible and new values can be added in the future without a

        major version change. Please ensure this is factored into your

        application code.


        `FEE`: any type of fee deducted for periodic billing or other operational processes. \

        `INTEREST`: any type of interest applied to TBOL account`

        '
      enum:
      - FEE
      - INTEREST
    TransactionMandateReference:
      type:
      - string
      - 'null'
      description: The reference to the mandate ID for Direct Debit transactions
      example: MAND001
    InterestDetail:
      type:
      - object
      - 'null'
      description: The unit and value of interest.
      properties:
        unit:
          $ref: '#/components/schemas/InterestDetailUnit'
        value:
          type: number
          format: double
          example: 0.5
      required:
      - unit
      - value
    QuoteBuyCurrency:
      type: string
      description: 'The ISO 4217 currency code representing the currency being bought. This value must correspond to the currency of the destination account to which funds are credited.

        '
      enum:
      - GBP
      - EUR
      - USD
      example: USD
    schemas-TransactionAmount:
      allOf:
      - description: The monetary value of the transaction as booked on The Bank of London account
      - $ref: '#/components/schemas/TransactionAmount'
    AccountOwnership1:
      type: string
      default: ALL
      description: 'Supplying the `accountOwnership` will return Virtual Accounts for specific ownership. \

        `ALL`: all Virtual Accounts directly and indirectly linked to the requestor \

        `DIRECT`: Virtual Accounts directly linked to the requestor \

        `INDIRECT`: Virtual Accounts for both individuals and organisations

        '
      example: ALL
      enum:
      - ALL
      - DIRECT
      - INDIRECT
    AccountCreatedDateTime:
      type: string
      description: The date and time when the account was created.
      format: date-time
      example: '2022-01-30T08:30:00Z'
    HierarchyType:
      type: string
      enum:
      - NEGATIVE_BALANCE_ENABLED
      - POSITIVE_BALANCE_ENFORCED
      description: 'Type of virtual hierarchy. \

        `NEGATIVE_BALANCE_ENABLED`: Hierarchy with enabled negative balance. Balances of Virtual Accounts in such hierarchy can drop below zero as long as header account has sufficient balance. \

        `POSITIVE_BALANCE_ENFORCED`: Hierarchy with enforced positive balance. Balances of Virtual Accounts in such hierarchy can not drop below 0.

        '
    PhysicalAccountClosureReason:
      type: string
      description: '<span style="color:#f46d2a">**Attention**</span> \

        Please note that the allowed values for the **type** are

        extensible and new can be added in the future without a

        major version change. Please ensure this is factored into your

        application code.


        The reason for the account cloosure. \

        `CUST_INITIATED`: Customer initiated the closure of the account. \

        `CUST_DECEASED`: Customer is deceased. \

        `FRAUD_AML`: Account or customer linked to fraud. \

        `ACCT_TRANSFER`: Account was transferred to another bank.

        '
      enum:
      - CUST_INITIATED
      - CUST_DECEASED
      - FRAUD_AML
      - ACCT_TRANSFER
    TransactionPaymentOrderId:
      type: string
      description: 'Filters transactions associated with the specified paymentOrderId.

        '
    AccountStatus:
      allOf:
      - $ref: '#/components/schemas/Status'
      - description: '<span style="color:#f46d2a">**Attention**</span> \

          Please note that the oneOf status is extensible and new objects can be returned

          with the new account status **identifier** in the future without a major version change.

          Please ensure this is factored into your application code.


          The current status of the account.

          '
      - oneOf:
        - title: ACTIVE
          properties:
            identifier:
              enum:
              - ACTIVE
              description: Account is active and can be used to process payments.
        - title: CLOSED
          properties:
            identifier:
              enum:
              - CLOSED
              description: Account is closed.
    UnauthorizedError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseJSON'
      - properties:
          status:
            enum:
            - 401
          name:
            enum:
            - Unauthorized
          message:
            example: Missing x-jws-signature header
    InterestDetailUnit:
      description: The unit of interest.
      type: string
      enum:
      - '%'
    TransactionFromDate:
      type: string
      description: 'The oldest posting date from which the transactions will be

        provided.

        '
      format: date
      example: '2022-10-07'
    TransactionToDate:
      type: string
      description: 'The most recent posting date from which the transactions will be

        provided.

        '
      format: date
      example: '2022-10-07'
    AccountBalances:
      type: object
      description: Account balances.
      properties:
        available:
          type: number
          description: 'The available balance is the amount of money that the account holder

            can withdraw immediately.

            Note: For Virtual Accounts with negative balance enabled, the available balance will not be displayed in the response body as the available balance is only applicable to the Header Account.

            '
          format: double
          example: 1000
        current:
          type: number
          description: The current balance includes any pending transactions that have not yet been cleared.
          format: double
          example: 2000
      required:
      - current
    UpdateVirtualAccountRequest:
      type: object
