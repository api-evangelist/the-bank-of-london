apis:
- name: Bank of London API
  description: >-
    The Bank of London's public REST banking API (v2/v3 path-versioned), published as OpenAPI 3.0.3
    from the Developer Studio. 58 operations across ten tags — Accounts, Customer Management,
    Virtual Account Management, Confirmation of Payee, Payments V2 (internal, Faster Payments, Bacs,
    CHAPS, agency and FX/cross-border), Standing Orders, Transactions, Mandates (Direct Debits),
    Statements and Webhook Management. Requests are authenticated with a per-request detached JWS
    (PS256) in the `x-jws-signature` header, signed with an API key created in the Developer Studio;
    payments and standing orders carry a client-supplied `idempotencyId`.
  humanURL: https://developer.bankoflondon.com/apis/the-bank-of-london-api
  baseURL: https://api.bankoflondon.com/
