aid: the-bank-of-london
name: The Bank of London
description: >-
  The Bank of London (TBOL) is a UK principal clearing bank and Banking-as-a-Service provider,
  authorised by the Bank of England's Prudential Regulation Authority and regulated by the FCA and
  PRA (FRN 930379). Operating a "safer by design" model in which client deposits are never loaned,
  invested or leveraged, it offers clearing, payments and settlement, agency banking, embedded
  banking (BaaS) and commercial and corporate banking to banks, non-bank financial institutions,
  virtual-asset service providers, digital platforms, financial intermediaries and corporates. Its
  Developer Studio at developer.bankoflondon.com publishes a public OpenAPI 3.0.3 contract for the
  Bank of London API v2 covering accounts, customer onboarding, virtual account management,
  Confirmation of Payee, Faster Payments, Bacs, CHAPS, agency and cross-border payments, standing
  orders, direct-debit mandates, transactions, statements and webhooks, backed by a free open
  sandbox that requires no NDA. A separate PSD2 / Open Banking UK v3.1 TPP interface is operated on
  the bank's behalf by Salt Edge Priora under provider code `tbol`.
