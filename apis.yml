- name: Bank of London PSD2 / Open Banking UK API
  description: >-
    The dedicated PSD2 Third Party Provider (TPP) interface for The Bank of London, implementing the
    UK Open Banking Read/Write API v3.1 (AIS, PIS, PIIS, plus dynamic client registration and
    OpenID Connect). It is operated on the bank's behalf by Salt Edge Priora — the bank's own
    Developer Studio publishes priora.saltedge.com as the access point under provider code `tbol`
    (live, launched 3 April 2024) and `tbol_sandbox`. No machine-readable contract for this
    interface is published by either party; the surface is the OBIE v3.1 standard.
  humanURL: https://priora.saltedge.com/docs/open_banking/tbol/v3.1
  baseURL: https://priora.saltedge.com
