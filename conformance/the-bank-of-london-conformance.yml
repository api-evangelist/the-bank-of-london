certifications:
  published: []
  note: >-
    No trust centre, SOC 2, ISO 27001, PCI DSS or comparable certification page is published on any
    Bank of London host (probe-security-programs.py, 2026-08-30, trust=none). The bank's public
    assurance story is its PRA authorisation and FCA/PRA regulation, its FSCS deposit protection
