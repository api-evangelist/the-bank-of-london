summary: >-
  A UK-regulated clearing bank with a real domain-standard footprint. The core Bank of London API is
  a bespoke REST contract — it is NOT an Open Banking API and does not claim to be — but the bank
  operates a separate, regulator-mandated PSD2 TPP interface built to the UK Open Banking Read/Write
  Standard v3.1, and the core API's own scheme semantics (Faster Payments, Bacs, CHAPS, Confirmation
  of Payee, Bacs Direct Debit mandate reason codes, IBAN/BIC and ISO 4217 currency handling) are
  the UK national payment-scheme standards rather than vendor inventions.
