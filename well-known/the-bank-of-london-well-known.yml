summary: >-
  A complete miss. Every /.well-known/ path returned 404 on every host — the two API hosts
  (api.bankoflondon.com, sandbox-api.bankoflondon.com) return a JSON {"message":"Not Found"} from the
  API gateway, the Developer Studio returns its Next.js 404 shell, and the marketing site returns a
  purpose-built "Invalid .well-known request" page, which is itself evidence that the platform
  deliberately handles the namespace and serves nothing in it. No security.txt (RFC 9116), no
  api-catalog (RFC 9727), no OIDC discovery, no OAuth authorization-server metadata, no ai-plugin.json
  and no A2A agent card at either the current or the legacy path.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer are emitted in apis.yml. Zero paths returned a 200
  carrying a document. This file records a verified absence, not a presence.
false_positive_watch: >-
