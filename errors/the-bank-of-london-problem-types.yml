  The Bank of London API does NOT use RFC 9457 problem+json. Errors are a vendor JSON envelope
  (components.schemas.ErrorResponseJSON) served as application/json with a machine-readable `code`
  string, and every error response carries a required `x-correlation-id` response header for support
  tracing. The contract defines 10 generic status-level responses and 20 operation-specific
  refinements that enumerate the exact `code` values each endpoint can return — an unusually complete
  error registry for a banking API.
