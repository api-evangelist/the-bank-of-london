summary: >-
  The Bank of London publishes its scheme-level payment failure reasons inside the OpenAPI rather
  than as a separate decline-code reference page. `status.detailedStatusIdentifier` on a payment
  carries the Faster Payments scheme reason (FPS_*) that explains WHY a payment landed in its
  status; direct-debit mandates carry a Bacs cancellation reason code (0/1/2/B). The bank warns in
  the spec that these enums are EXTENSIBLE and may gain values without a major version change, so
  clients must default-case unknown values.
envelope_field: status.detailedStatusIdentifier
