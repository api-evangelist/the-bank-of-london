note: >-
  No card-network decline codes exist — The Bank of London is a clearing/BaaS bank, not a card
  acquirer. Retryability is not documented per code; treat FPS_FUNDS_NOT_AVAILABLE and
  FPS_SCHEME_IS_DOWN as the only plausibly transient reasons and confirm with the bank before
  automating any retry.
