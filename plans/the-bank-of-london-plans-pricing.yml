summary: >-
  The Bank of London does not sell API access as a metered developer plan. There is no per-call or
  per-seat API pricing and no self-serve tier. What IS published is a banking fee schedule for
  Regulated Financial Institutions — flat per-payment scheme charges and a set of account products
  whose fees are either zero (savings/notice deposits) or "provided upon request" (operating,
  safeguarding and client-money accounts). Access to the API sandbox itself is free and, per the
  bank's own statement, requires no NDA and sits behind no paywall; production access follows a
  commercial onboarding conversation.
